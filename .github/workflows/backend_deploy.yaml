name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          # ✅ 修复核心：使用环境变量写入，避免 Shell 解析特殊字符
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          
          pnpm install --no-frozen-lockfile

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          if [ "$debug_mode" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy >/dev/null 2>&1; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              exit "$code"
            fi
          fi
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ✅ 将 secret 映射到环境变量中
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}

      - name: Ensure wildcard MX for random subdomains
        run: |
          cd worker/
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          node <<'NODE'
          const fs = require('node:fs');

          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) {
            throw new Error('CLOUDFLARE_API_TOKEN is required');
          }

          const toml = fs.readFileSync('wrangler.toml', 'utf8');
          const match = toml.match(/^\s*RANDOM_SUBDOMAIN_DOMAINS\s*=\s*\[(.*)\]\s*$/m);
          if (!match) {
            console.log('No RANDOM_SUBDOMAIN_DOMAINS configured; skip wildcard MX setup.');
            process.exit(0);
          }

          const domains = [...match[1].matchAll(/"([^"]+)"/g)]
            .map((item) => item[1].trim().toLowerCase())
            .filter(Boolean);
          if (domains.length === 0) {
            console.log('RANDOM_SUBDOMAIN_DOMAINS is empty; skip wildcard MX setup.');
            process.exit(0);
          }

          const mxRecords = [
            { content: 'route2.mx.cloudflare.net', priority: 5 },
            { content: 'route1.mx.cloudflare.net', priority: 30 },
            { content: 'route3.mx.cloudflare.net', priority: 46 },
          ];

          async function cf(path, init = {}) {
            const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, {
              ...init,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(init.headers || {}),
              },
            });
            const data = await response.json();
            if (!response.ok || !data.success) {
              throw new Error(JSON.stringify(data.errors || data, null, 2));
            }
            return data.result;
          }

          async function main() {
            for (const domain of domains) {
              const zones = await cf(`/zones?name=${encodeURIComponent(domain)}`);
              const zone = zones[0];
              if (!zone) {
                throw new Error(`Zone not found for ${domain}`);
              }

            const wildcardName = `*.${domain}`;
            const existing = await cf(`/zones/${zone.id}/dns_records?type=MX&name=${encodeURIComponent(wildcardName)}`);
            const wildcardRecords = await cf(`/zones/${zone.id}/dns_records?name=${encodeURIComponent(wildcardName)}`);
            for (const item of wildcardRecords) {
              console.log(`Current DNS ${item.name} ${item.type} ${item.content} ${item.priority ?? ''}`);
            }
            for (const record of mxRecords) {
                const alreadyExists = existing.some((item) =>
                  item.content.replace(/\.$/, '') === record.content && item.priority === record.priority
                );
                if (alreadyExists) {
                  console.log(`Skip existing MX ${wildcardName} -> ${record.content} (${record.priority})`);
                  continue;
                }
                await cf(`/zones/${zone.id}/dns_records`, {
                  method: 'POST',
                  body: JSON.stringify({
                    type: 'MX',
                    name: wildcardName,
                    content: record.content,
                    priority: record.priority,
                    ttl: 1,
                    proxied: false,
                  }),
                });
                console.log(`Created MX ${wildcardName} -> ${record.content} (${record.priority})`);
              }
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
